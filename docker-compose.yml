services:
  db:
    image: postgres:16
    container_name: doc-agent-db
    environment:
      POSTGRES_USER: docagent
      POSTGRES_PASSWORD: docagent
      POSTGRES_DB: docagent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docagent -d docagent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: